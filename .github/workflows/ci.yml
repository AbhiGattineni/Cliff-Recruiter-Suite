name: CI

# Runs on every push and pull request, and can be started by hand from the
# Actions tab (Run workflow) when you want to verify a build on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        # Advisory: lint problems shouldn't hide a passing test run.
        run: npm run lint
        continue-on-error: true

      - name: Test
        # Always run the summary step below, even when tests fail.
        run: npx vitest run --reporter=default --reporter=json --outputFile=test-results.json

      - name: Test summary
        if: always()
        run: node scripts/ci-summary.mjs test-results.json

      - name: Build
        run: npx vite build

      - name: Check the dev-only preview harness stayed out of the bundle
        run: node scripts/check-bundle.mjs

      - name: Upload build + test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist
            test-results.json
          retention-days: 7

  functions:
    name: Cloud Functions — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        working-directory: functions
        run: npm ci

      - name: Build
        working-directory: functions
        run: npm run build
