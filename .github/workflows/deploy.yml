name: Deploy

# Builds the web app + Cloud Functions and deploys them to Firebase.
# Runs on every push to main, and can be triggered by hand from the Actions
# tab for a manual redeploy (e.g. after adding/rotating a secret).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT   JSON key for a service account with deploy
#                              rights on the Firebase project (Firebase Admin,
#                              Cloud Functions Admin, Firebase Hosting Admin,
#                              Service Account User, Cloud Build Editor).
#   VITE_FIREBASE_CONFIG       The Firebase web config, pasted as-is from the
#                              Firebase console ("Project settings" → "Your
#                              apps" → the `firebaseConfig` snippet). Either
#                              the raw JS object literal or the whole code
#                              snippet works — the "Load Firebase web config"
#                              step below extracts and parses it. Not secret
#                              in the sense of being sensitive (it's safe to
#                              ship in the browser bundle), but it still needs
#                              to be the real value for the deployed site to
#                              work, so it's a repo secret rather than committed.
#
# Cloud Functions secrets (CEIPAL_PASSWORD, LLM_API_KEY, etc.) are managed
# separately via `firebase functions:secrets:set` — this workflow does not
# touch them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install web deps
        run: npm ci

      - name: Load Firebase web config
        # Accepts either the raw firebaseConfig object literal or the whole
        # code snippet copied from the Firebase console (imports, comments,
        # unquoted keys, trailing commas and all) — extracts the object,
        # turns it into valid JSON, and writes each field as a VITE_FIREBASE_*
        # env var for the build step below.
        run: |
          node -e '
            const raw = (process.env.VITE_FIREBASE_CONFIG || "").trim();
            if (!raw) {
              console.error("VITE_FIREBASE_CONFIG secret is empty.");
              process.exit(1);
            }
            const snippetMatch = raw.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\n\})/);
            let objSrc = snippetMatch ? snippetMatch[1] : raw;
            objSrc = objSrc
              .replace(/\/\/.*$/gm, "")
              .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, "$1\"$2\":")
              .replace(/,(\s*[}\]])/g, "$1");
            let cfg;
            try {
              cfg = JSON.parse(objSrc);
            } catch (e) {
              console.error("Could not parse VITE_FIREBASE_CONFIG:", e.message);
              console.error("Extracted text was:", objSrc);
              process.exit(1);
            }
            const fs = require("fs");
            const lines = [
              `VITE_FIREBASE_API_KEY=${cfg.apiKey || ""}`,
              `VITE_FIREBASE_AUTH_DOMAIN=${cfg.authDomain || ""}`,
              `VITE_FIREBASE_PROJECT_ID=${cfg.projectId || ""}`,
              `VITE_FIREBASE_STORAGE_BUCKET=${cfg.storageBucket || ""}`,
              `VITE_FIREBASE_MESSAGING_SENDER_ID=${cfg.messagingSenderId || ""}`,
              `VITE_FIREBASE_APP_ID=${cfg.appId || ""}`,
              `VITE_FIREBASE_MEASUREMENT_ID=${cfg.measurementId || ""}`,
            ];
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
            console.log("Parsed Firebase config for project:", cfg.projectId || "(missing projectId)");
          '
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}

      - name: Build web app
        run: npx vite build
        env:
          VITE_FUNCTIONS_REGION: us-central1

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Two steps, deliberately, and the site goes first.
      #
      # us-central1 keeps refusing a Cloud Run revision for one function or
      # another — "Quota exceeded for total allowable CPU per project per
      # region". As a single `deploy --only functions,hosting,...` that aborts
      # the whole run before hosting is released, so the site silently stays on
      # an older build for a reason that has nothing to do with the site. The
      # quota failure is still a red build below; it just can't take hosting
      # down with it any more.
      #
      # The order does mean a new UI can be live for a minute or two before the
      # function it calls. That's the cheaper failure: a brief error on one
      # page, rather than a deploy that looks done and shipped nothing.
      #
      # --force: deploy also deletes any function removed from the codebase,
      # which normally needs an interactive confirmation.
      - name: Deploy hosting + Firestore rules
        run: npx firebase-tools@13 deploy --only hosting,firestore:rules --project cliff-services --non-interactive --force

      # Two passes, for the same quota reason.
      #
      # The regional CPU quota is spent on the ceiling each service is allowed
      # to scale to, so a deploy that lowers those ceilings frees the headroom a
      # *new* function needs — but only once it has landed. Doing it in one pass
      # is a chicken-and-egg: the new function is created in the same breath
      # that would have made room for it, and fails.
      #
      # So refresh what is already deployed first, then deploy the lot. The
      # second pass is a no-op for anything the first one already settled, and
      # if the listing fails it simply falls back to a single ordinary deploy.
      - name: Deploy Cloud Functions
        run: |
          set -euo pipefail
          in_source=$(grep -oP '^export const \K\w+(?= = onCall)' functions/src/index.ts | sort -u)
          deployed=$(npx firebase-tools@13 functions:list --project cliff-services --json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const f of JSON.parse(s).result||[])if(f.id)console.log(f.id)}catch{}})' \
            | sort -u)
          only=$(comm -12 <(echo "$in_source") <(echo "$deployed") | sed 's/^/functions:/' | paste -sd, -)
          if [ -n "$only" ]; then
            # Not fatal: pass 1 exists only to free quota, and it is expected to
            # report a failure for anything already wedged by the shortage it is
            # there to clear. Pass 2 below is the one that has to pass.
            echo "Pass 1 — already deployed: $only"
            npx firebase-tools@13 deploy --only "$only" --project cliff-services --non-interactive --force || true
          fi
          echo "Pass 2 — all functions"
          npx firebase-tools@13 deploy --only functions --project cliff-services --non-interactive --force
