name: Deploy

# Builds the web app + Cloud Functions and deploys them to Firebase.
# Runs on every push to main, and can be triggered by hand from the Actions
# tab for a manual redeploy (e.g. after adding/rotating a secret).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT   JSON key for a service account with deploy
#                              rights on the Firebase project (Firebase Admin,
#                              Cloud Functions Admin, Firebase Hosting Admin,
#                              Service Account User, Cloud Build Editor).
#   VITE_FIREBASE_CONFIG       The Firebase web config, pasted as-is from the
#                              Firebase console ("Project settings" → "Your
#                              apps" → the `firebaseConfig` snippet). Either
#                              the raw JS object literal or the whole code
#                              snippet works — the "Load Firebase web config"
#                              step below extracts and parses it. Not secret
#                              in the sense of being sensitive (it's safe to
#                              ship in the browser bundle), but it still needs
#                              to be the real value for the deployed site to
#                              work, so it's a repo secret rather than committed.
#
# Cloud Functions secrets (CEIPAL_PASSWORD, LLM_API_KEY, etc.) are managed
# separately via `firebase functions:secrets:set` — this workflow does not
# touch them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install web deps
        run: npm ci

      - name: Load Firebase web config
        # Accepts either the raw firebaseConfig object literal or the whole
        # code snippet copied from the Firebase console (imports, comments,
        # unquoted keys, trailing commas and all) — extracts the object,
        # turns it into valid JSON, and writes each field as a VITE_FIREBASE_*
        # env var for the build step below.
        run: |
          node -e '
            const raw = (process.env.VITE_FIREBASE_CONFIG || "").trim();
            if (!raw) {
              console.error("VITE_FIREBASE_CONFIG secret is empty.");
              process.exit(1);
            }
            const snippetMatch = raw.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\n\})/);
            let objSrc = snippetMatch ? snippetMatch[1] : raw;
            objSrc = objSrc
              .replace(/\/\/.*$/gm, "")
              .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, "$1\"$2\":")
              .replace(/,(\s*[}\]])/g, "$1");
            let cfg;
            try {
              cfg = JSON.parse(objSrc);
            } catch (e) {
              console.error("Could not parse VITE_FIREBASE_CONFIG:", e.message);
              console.error("Extracted text was:", objSrc);
              process.exit(1);
            }
            const fs = require("fs");
            const lines = [
              `VITE_FIREBASE_API_KEY=${cfg.apiKey || ""}`,
              `VITE_FIREBASE_AUTH_DOMAIN=${cfg.authDomain || ""}`,
              `VITE_FIREBASE_PROJECT_ID=${cfg.projectId || ""}`,
              `VITE_FIREBASE_STORAGE_BUCKET=${cfg.storageBucket || ""}`,
              `VITE_FIREBASE_MESSAGING_SENDER_ID=${cfg.messagingSenderId || ""}`,
              `VITE_FIREBASE_APP_ID=${cfg.appId || ""}`,
              `VITE_FIREBASE_MEASUREMENT_ID=${cfg.measurementId || ""}`,
            ];
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
            console.log("Parsed Firebase config for project:", cfg.projectId || "(missing projectId)");
          '
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}

      - name: Build web app
        run: npx vite build
        env:
          VITE_FUNCTIONS_REGION: us-central1

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Two steps, deliberately, and the site goes first.
      #
      # us-central1 keeps refusing a Cloud Run revision for one function or
      # another — "Quota exceeded for total allowable CPU per project per
      # region". As a single `deploy --only functions,hosting,...` that aborts
      # the whole run before hosting is released, so the site silently stays on
      # an older build for a reason that has nothing to do with the site. The
      # quota failure is still a red build below; it just can't take hosting
      # down with it any more.
      #
      # The order does mean a new UI can be live for a minute or two before the
      # function it calls. That's the cheaper failure: a brief error on one
      # page, rather than a deploy that looks done and shipped nothing.
      #
      # --force: deploy also deletes any function removed from the codebase,
      # which normally needs an interactive confirmation.
      - name: Deploy hosting + Firestore rules
        run: npx firebase-tools@13 deploy --only hosting,firestore:rules --project cliff-services --non-interactive --force

      # Deployed in batches, because of the regional CPU quota.
      #
      # Cloud Run spends that quota on the ceiling each service is allowed to
      # scale to, and an update runs a new revision beside the old one until
      # traffic moves — so a deploy needs headroom for a second copy of
      # everything it touches at once.
      #
      # The old shape here was two whole-codebase passes. It hid a failure
      # rather than avoiding one: a run where nineteen of twenty-two services
      # were refused on quota in pass 1 then reported every one of them as
      # "Skipped (No changes detected)" in pass 2, because firebase-tools
      # records the source as current even when the revision never became
      # ready. A red build that shipped nothing looked almost identical to a
      # red build that shipped everything but the scheduler.
      - name: Deploy Cloud Functions
        run: |
          # No `set -e`: this step runs several deploys on purpose and decides
          # its own exit status at the end, from what actually failed.
          set -uo pipefail
          in_source=$(grep -oP '^export const \K\w+(?= = onCall)' functions/src/index.ts | sort -u || true)
          echo "In source: $(echo "$in_source" | tr '\n' ' ')"

          # Deploy in small batches, not all at once.
          #
          # Cloud Run charges the regional CPU quota by what a service may scale
          # to (cpu x maxInstances), and an update runs its new revision beside
          # the old one until traffic moves. Deploying twenty-two services in
          # one command therefore asks the region for a second copy of nearly
          # everything at the same moment, and us-central1 does not have that
          # much headroom: one run had nineteen of twenty-two refused with
          # "Quota exceeded for total allowable CPU per project per region".
          #
          # A batch of four needs headroom for four overlapping revisions
          # instead of twenty-two, and each batch's old revisions retire before
          # the next starts. The sleep gives that retirement a moment to
          # actually free the reservation.
          #
          # This is also why the step cannot be judged on one command's exit
          # code any more: it runs several, so failures are counted and
          # reported at the end.
          batch=()
          failed=""
          flush() {
            [ ${#batch[@]} -eq 0 ] && return 0
            local only
            only=$(printf 'functions:%s,' "${batch[@]}" | sed 's/,$//')
            echo "--- deploying: $only"
            if ! npx firebase-tools@13 deploy --only "$only" --project cliff-services --non-interactive --force; then
              failed="$failed ${batch[*]}"
            fi
            batch=()
            sleep 20
          }

          for fn in $in_source; do
            batch+=("$fn")
            [ ${#batch[@]} -ge 4 ] && flush
          done
          flush

          # The scheduled functions are not onCall, so they are not in
          # `in_source`; this catches them and anything else the grep missed.
          echo "--- deploying anything left (schedules, triggers)"
          npx firebase-tools@13 deploy --only functions --project cliff-services --non-interactive --force || failed="$failed <final-pass>"

          if [ -n "$failed" ]; then
            echo "::error::Functions that did not deploy:$failed"
            exit 1
          fi

      # A callable is a Cloud Run service, and the browser reaches it as an
      # anonymous caller — the user's identity travels in the request body, not
      # as a Google credential — so the service has to allow unauthenticated
      # invocation. `firebase deploy` grants that when it CREATES a function and
      # never revisits it, which is a gap the quota failures walked straight
      # into: consultantOps failed part-way through its create, and the deploy
      # that finally succeeded saw an existing service and only updated it. The
      # function was live and healthy and every call from the app was rejected
      # 403 by Cloud Run — which the client SDK reports as an "internal" error,
      # i.e. indistinguishable from a function that was never deployed.
      #
      # Authentication is not being given up here: every callable checks
      # request.auth itself and refuses anonymous callers, and this is already
      # the binding every other function in the project has. Adding it is
      # idempotent, so this just keeps them all in the same state.
      - name: Ensure callables are publicly invokable
        run: |
          set -uo pipefail
          for fn in $(grep -oP '^export const \K\w+(?= = onCall)' functions/src/index.ts | sort -u); do
            svc=$(echo "$fn" | tr '[:upper:]' '[:lower:]')
            if gcloud run services get-iam-policy "$svc" --region us-central1 --project cliff-services \
                 --format=json 2>/dev/null | grep -q '"allUsers"'; then
              echo "ok       $fn"
            else
              echo "MISSING  $fn — granting run.invoker to allUsers"
              gcloud run services add-iam-policy-binding "$svc" \
                --region us-central1 --project cliff-services \
                --member allUsers --role roles/run.invoker --quiet \
                && echo "fixed    $fn" || echo "FAILED   $fn (needs run.setIamPolicy on the deploy account)"
            fi
          done
